plugins { id 'com.android.application' }
android {
    namespace 'dev.local.tvhomeselector'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'dev.local.tvhomeselector'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2-local-adb'
    }
    signingConfigs {
        debug {
            // Optional existing local debug key, useful for updating an installed build.
            // Otherwise Android's normal local debug signing configuration is used.
            if (System.getenv('HOME_SWITCHER_DEBUG_KEYSTORE')) {
                storeFile file(System.getenv('HOME_SWITCHER_DEBUG_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        textReport true
        textOutput file('stdout')
        xmlReport false
        htmlReport false
        sarifReport false
    }
}
